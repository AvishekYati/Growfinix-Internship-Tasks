name: Growfinix IPL MLOps Pipeline

on:

  push:

    branches:
      - main

    paths:

      - "IPL_MLOps_Pipeline/data/raw/ipl_json/**"

      - "IPL_MLOps_Pipeline/src/**"

      - "IPL_MLOps_Pipeline/tests/**"

      - "IPL_MLOps_Pipeline/requirements.txt"

      - "IPL_MLOps_Pipeline/requirements-api.txt"

      - "IPL_MLOps_Pipeline/Dockerfile"

      - ".github/workflows/ipl-mlops.yml"

  workflow_dispatch:


permissions:

  contents: read

  packages: write


jobs:

  retrain-and-publish:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    defaults:

      run:

        working-directory: IPL_MLOps_Pipeline


    steps:

      # STEP 1: Download repository source code.

      - name: Checkout repository

        uses: actions/checkout@v7


      # STEP 2: Configure Python.

      - name: Set up Python

        uses: actions/setup-python@v7

        with:

          python-version: "3.14"

          cache: pip

          cache-dependency-path: IPL_MLOps_Pipeline/requirements.txt


      # STEP 3: Install required dependencies.

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # STEP 4: Run unit tests.

      - name: Run unit tests

        env:

          PYTHONPATH: src

        run: |

          python -m pytest -q


      # STEP 5: Automatically retrain the model.

      - name: Train IPL prediction model

        env:

          PYTHONPATH: src

          MLFLOW_TRACKING_URI: file:./mlruns

        run: |

          python -m ipl_mlops.train


      # STEP 6: Preserve model and MLflow results.

      - name: Upload training artifacts

        uses: actions/upload-artifact@v7

        with:

          name: ipl-mlops-training-${{ github.run_number }}

          path: |

            IPL_MLOps_Pipeline/artifacts/

            IPL_MLOps_Pipeline/mlruns/

            IPL_MLOps_Pipeline/data/processed/

          if-no-files-found: error

          retention-days: 30


      # STEP 7: Authenticate with GitHub Container Registry.

      - name: Login to GitHub Container Registry

        uses: docker/login-action@v4

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # STEP 8: Configure Docker Buildx.

      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v4


      # STEP 9: Build updated Docker image.

      - name: Build and push Docker image

        uses: docker/build-push-action@v7

        with:

          context: ./IPL_MLOps_Pipeline

          file: ./IPL_MLOps_Pipeline/Dockerfile

          platforms: linux/amd64

          push: true

          tags: |

            ghcr.io/avishekyati/growfinix-ipl-mlops:latest

            ghcr.io/avishekyati/growfinix-ipl-mlops:${{ github.sha }}

          cache-from: type=gha

          cache-to: type=gha,mode=max


      # STEP 10: Optional automatic Render deployment.

      - name: Trigger Render deployment

        if: ${{ vars.RENDER_DEPLOY_ENABLED == 'true' }}

        env:

          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

        run: |

          if [ -z "$RENDER_DEPLOY_HOOK" ]; then

            echo "RENDER_DEPLOY_HOOK secret is missing."

            exit 1

          fi

          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"